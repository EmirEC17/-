<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti...</title>
  <style>
    /* Estilos generales y fondo oscuro */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050505;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow: hidden; 
    }

    /* Pantalla inicial con el girasol */
    #pantalla-inicio {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 1s ease;
    }

    .girasol-inicio {
      font-size: 8rem;
      margin-bottom: 20px;
      animation: latido-suave 3s infinite;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
    }

    .texto-inicio {
      color: #ffd700;
      font-size: 1.5rem;
      font-style: italic;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      animation: palpitar 2s infinite;
    }

    /* Título principal de las flores amarillas */
    #titulo-flores {
      position: absolute;
      top: 5%;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
      z-index: 10;
      display: none;
      font-family: serif;
      font-style: italic;
    }

    /* Lienzo para las partículas (Corazón y estrellas) */
    #canvas-fondo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Contenedor de frases flotantes */
    #contenedor-frases {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      display: none;
    }

    .frase-flotante {
      position: absolute;
      color: white;
      font-size: 1rem;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      opacity: 0;
      animation: flotar-frase 10s linear infinite;
    }

    .flor-flotante {
      position: absolute;
      font-size: 2rem;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
      animation: flotar-frase 12s linear infinite;
    }

    /* El buzón con notificación */
    #buzon-contenedor {
      position: fixed;
      bottom: 40px;
      right: 40px;
      z-index: 20;
      display: none;
      cursor: pointer;
      transition: transform 0.3s;
    }

    #buzon-contenedor:hover {
      transform: scale(1.1);
    }

    .buzon-icono {
      font-size: 4rem;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
    }

    .notificacion {
      position: absolute;
      top: -5px;
      right: -10px;
      background-color: #ff3b3b;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px rgba(255, 59, 59, 0.8);
      animation: latido-rapido 1s infinite;
    }

    /* Animaciones CSS */
    @keyframes latido-suave {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes palpitar {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes latido-rapido {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    @keyframes flotar-frase {
      0% { transform: translateY(100px) scale(0.8); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1.1); opacity: 0; }
    }

    /* La carta emergente (Modal) */
    #modal-carta {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 85%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
      padding: 30px;
      border-radius: 15px;
      z-index: 50;
      text-align: center;
      opacity: 0;
      transition: all 0.5s ease;
    }

    #modal-carta.mostrar {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #modal-carta h1 { color: #ffd700; margin-top: 0; font-family: serif; font-style: italic; }
    #modal-carta p { line-height: 1.6; font-size: 1.1rem; }
    .btn-cerrar {
      margin-top: 25px; background: #ffd700; color: #000; border: none; padding: 10px 25px;
      border-radius: 20px; font-weight: bold; cursor: pointer; transition: background 0.3s;
    }
    .btn-cerrar:hover { background: #ffea70; }
  </style>
</head>
<body>

  <audio id="musica" loop>
    <source src="cancion.mp3" type="audio/mpeg">
  </audio>

  <canvas id="canvas-fondo"></canvas>
  <div id="contenedor-frases"></div>

  <h1 id="titulo-flores">Feliz día de las Flores Amarillas 🌻</h1>

  <!-- Pantalla inicial tipo TikTok -->
  <div id="pantalla-inicio">
    <div class="girasol-inicio">🌻</div>
    <div class="texto-inicio" id="btn-iniciar">Toca para iniciar</div>
  </div>

  <!-- Buzón con notificación -->
  <div id="buzon-contenedor">
    <div class="buzon-icono">📬</div>
    <div class="notificacion">1</div>
  </div>

  <!-- Modal de la carta -->
  <div id="modal-carta">
    <h1>Para ti</h1>
    <p>Aquí escribes tu carta. Al estar dentro del buzón, la persona sentirá que acaba de recibir correo.</p>
    <p>Agrega los párrafos que necesites.</p>
    <button class="btn-cerrar" id="btn-cerrar">Cerrar carta</button>
  </div>

  <script>
    // Referencias al DOM
    const pantallaInicio = document.getElementById('pantalla-inicio');
    const tituloFlores = document.getElementById('titulo-flores');
    const buzonContenedor = document.getElementById('buzon-contenedor');
    const contenedorFrases = document.getElementById('contenedor-frases');
    const btnIniciar = document.getElementById('btn-iniciar');
    const modalCarta = document.getElementById('modal-carta');
    const btnCerrar = document.getElementById('btn-cerrar');
    const musica = document.getElementById('musica');

    // Textos flotantes
    const textos = [
      "Te quiero", "Feliz día", "Eres pura alegría", 
      "Sonríe siempre", "Luz en mi vida", "Un detalle amarillo", 
      "Eres muy especial", "Atesoro tu compañía", "Mi flor favorita"
    ];
    const flores = ["🌻", "🌻", "🌼", "💐"];

    // Función para crear elementos flotantes en posiciones aleatorias
    function crearFlotantes() {
      // Crear textos
      textos.forEach((texto, i) => {
        let el = document.createElement('div');
        el.className = 'frase-flotante';
        el.innerText = texto;
        el.style.left = Math.random() * 80 + 10 + '%';
        el.style.top = Math.random() * 80 + 10 + '%';
        el.style.animationDelay = (Math.random() * 5) + 's';
        contenedorFrases.appendChild(el);
      });
      // Crear flores
      for(let i=0; i<6; i++) {
        let el = document.createElement('div');
        el.className = 'flor-flotante';
        el.innerText = flores[Math.floor(Math.random() * flores.length)];
        el.style.left = Math.random() * 90 + 5 + '%';
        el.style.top = Math.random() * 90 + 5 + '%';
        el.style.animationDelay = (Math.random() * 5) + 's';
        contenedorFrases.appendChild(el);
      }
    }

    // Iniciar experiencia
    btnIniciar.addEventListener('click', () => {
      musica.play();
      pantallaInicio.style.opacity = '0';
      crearFlotantes();
      setTimeout(() => {
        pantallaInicio.style.display = 'none';
        tituloFlores.style.display = 'block';
        buzonContenedor.style.display = 'block';
        contenedorFrases.style.display = 'block';
      }, 1000);
    });

    // Abrir carta
    buzonContenedor.addEventListener('click', () => {
      modalCarta.style.display = 'block';
      setTimeout(() => {
        modalCarta.classList.add('mostrar');
      }, 10);
    });

    // Cerrar carta
    btnCerrar.addEventListener('click', () => {
      modalCarta.classList.remove('mostrar');
      setTimeout(() => {
        modalCarta.style.display = 'none';
      }, 500); 
    });

    // --- LÓGICA DEL CANVAS (Corazón y Estrellas) ---
    const canvas = document.getElementById('canvas-fondo');
    const ctx = canvas.getContext('2d');
    
    function redimensionarCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    redimensionarCanvas();
    window.addEventListener('resize', redimensionarCanvas);
    
    const particulasEstrellas = [];
    const particulasCorazon = [];
    
    // Ecuación matemática para dibujar un corazón
    function obtenerPuntoCorazon(t, escala) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x: x * escala, y: y * escala };
    }

    // Generar partículas del corazón en el centro
    const totalPuntosCorazon = 150;
    for(let i = 0; i < Math.PI * 2; i += (Math.PI * 2) / totalPuntosCorazon) {
      let punto = obtenerPuntoCorazon(i, window.innerWidth < 600 ? 8 : 12); 
      particulasCorazon.push({
        offsetX: punto.x,
        offsetY: punto.y,
        radio: Math.random() * 1.5 + 0.5,
        opacidad: Math.random(),
        velocidadParpadeo: Math.random() * 0.05 + 0.01
      });
    }

    // Generar estrellas de fondo
    for(let i = 0; i < 100; i++) {
      particulasEstrellas.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radio: Math.random() * 1.5 + 0.5,
        velocidadY: (Math.random() - 0.5) * 0.5,
        opacidad: Math.random()
      });
    }

    function animarCanvas() {
      requestAnimationFrame(animarCanvas);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const centroX = canvas.width / 2;
      const centroY = canvas.height / 2 + 20;

      // Dibujar partículas del corazón
      particulasCorazon.forEach(p => {
        ctx.beginPath();
        ctx.arc(centroX + p.offsetX, centroY + p.offsetY, p.radio, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.opacidad})`; 
        ctx.fill();
        
        // Parpadeo del corazón
        p.opacidad += p.velocidadParpadeo;
        if(p.opacidad <= 0.2 || p.opacidad >= 1) p.velocidadParpadeo *= -1;
      });

      // Dibujar estrellas de fondo
      particulasEstrellas.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radio, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.opacidad})`; 
        ctx.fill();
        
        p.y += p.velocidadY;
        if(p.y < 0) p.y = canvas.height;
        if(p.y > canvas.height) p.y = 0;
      });
    }
    
    animarCanvas();
  </script>

  <!-- Script de Analítica (GoatCounter) -->
  <script data-goatcounter="https://maybe-someday.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
