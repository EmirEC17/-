<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti...</title>
  <style>
    /* Estilos generales y fondo oscuro */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050505;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow: hidden; /* Evita que se pueda hacer scroll en el fondo */
    }

    /* Lienzo para las partículas brillantes del fondo */
    #canvas-fondo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Pantalla inicial de "Toca para iniciar" */
    #pantalla-inicio {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 1s ease;
    }

    .btn-iniciar {
      background: transparent;
      color: #fff;
      border: 2px solid #fff;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,255,255,0.5);
      animation: palpitar 2s infinite;
    }

    @keyframes palpitar {
      0% { box-shadow: 0 0 10px rgba(255,255,255,0.2); }
      50% { box-shadow: 0 0 25px rgba(255,255,255,0.8); }
      100% { box-shadow: 0 0 10px rgba(255,255,255,0.2); }
    }

    /* Contenedor principal donde está el buzón */
    #contenedor-principal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* El sobre / buzón */
    .buzon {
      font-size: 5rem;
      cursor: pointer;
      animation: flotar 3s ease-in-out infinite;
      transition: transform 0.3s;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
    }

    .buzon:hover {
      transform: scale(1.1);
    }

    .texto-buzon {
      margin-top: 20px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    @keyframes flotar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    /* La carta emergente (Modal) */
    #modal-carta {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 85%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
      padding: 30px;
      border-radius: 15px;
      z-index: 50;
      text-align: center;
      opacity: 0;
      transition: all 0.5s ease;
    }

    #modal-carta.mostrar {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #modal-carta h1 {
      color: #ffd700;
      margin-top: 0;
      font-family: serif;
      font-style: italic;
    }

    #modal-carta p {
      line-height: 1.6;
      font-size: 1.1rem;
    }

    .btn-cerrar {
      margin-top: 25px;
      background: #ffd700;
      color: #000;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-cerrar:hover {
      background: #ffea70;
    }
  </style>
</head>
<body>

  <!-- Música de fondo -->
  <audio id="musica" loop>
    <source src="cancion.mp3" type="audio/mpeg">
  </audio>

  <!-- Partículas de fondo (Canvas) -->
  <canvas id="canvas-fondo"></canvas>

  <!-- Pantalla 1: Botón para iniciar -->
  <div id="pantalla-inicio">
    <button class="btn-iniciar" id="btn-iniciar">Toca para iniciar</button>
  </div>

  <!-- Pantalla 2: El buzón flotante -->
  <div id="contenedor-principal">
    <div class="buzon" id="btn-buzon">💌</div>
    <div class="texto-buzon">Tienes una carta nueva...</div>
  </div>

  <!-- Pantalla 3: La carta que se abre -->
  <div id="modal-carta">
    <h1>Para ti</h1>
    <p>Aquí puedes empezar a escribir todo lo que le quieras decir.</p>
    <p>Puedes separar tus ideas en varios párrafos copiando y pegando estas etiquetas "p" para que el texto respire y se vea bien.</p>
    
    <button class="btn-cerrar" id="btn-cerrar">Cerrar carta</button>
  </div>

  <script>
    // Interfaz de usuario
    const pantallaInicio = document.getElementById('pantalla-inicio');
    const contenedorPrincipal = document.getElementById('contenedor-principal');
    const btnIniciar = document.getElementById('btn-iniciar');
    const btnBuzon = document.getElementById('btn-buzon');
    const modalCarta = document.getElementById('modal-carta');
    const btnCerrar = document.getElementById('btn-cerrar');
    const musica = document.getElementById('musica');

    btnIniciar.addEventListener('click', () => {
      musica.play();
      pantallaInicio.style.opacity = '0';
      setTimeout(() => {
        pantallaInicio.style.display = 'none';
        contenedorPrincipal.style.display = 'flex';
      }, 1000);
    });

    btnBuzon.addEventListener('click', () => {
      modalCarta.style.display = 'block';
      setTimeout(() => {
        modalCarta.classList.add('mostrar');
      }, 10);
    });

    btnCerrar.addEventListener('click', () => {
      modalCarta.classList.remove('mostrar');
      setTimeout(() => {
        modalCarta.style.display = 'none';
      }, 500); 
    });

    // Fondo de partículas mágicas
    const canvas = document.getElementById('canvas-fondo');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const particulas = [];
    const cantidadParticulas = 80;

    for(let i = 0; i < cantidadParticulas; i++) {
      particulas.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radio: Math.random() * 2 + 0.5,
        velocidadX: (Math.random() - 0.5) * 0.5,
        velocidadY: (Math.random() - 0.5) * 0.5,
        opacidad: Math.random()
      });
    }

    function animarParticulas() {
      requestAnimationFrame(animarParticulas);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particulas.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radio, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.opacidad})`; 
        ctx.fill();
        
        p.x += p.velocidadX;
        p.y += p.velocidadY;
        
        p.opacidad += (Math.random() - 0.5) * 0.05;
        if(p.opacidad < 0.1) p.opacidad = 0.1;
        if(p.opacidad > 1) p.opacidad = 1;
        
        if(p.x < 0 || p.x > canvas.width) p.velocidadX *= -1;
        if(p.y < 0 || p.y > canvas.height) p.velocidadY *= -1;
      });
    }
    
    animarParticulas();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

  <!-- Script de Analítica (GoatCounter) -->
  <script data-goatcounter="https://maybe-someday.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
